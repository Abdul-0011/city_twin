services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: citytwin-postgres
    environment:
      POSTGRES_DB: citytwin
      POSTGRES_USER: citytwin_user
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: citytwin-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: